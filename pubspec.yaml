name: smart_face_capture
description: A Flutter package for guided face photo capture with automatic pose detection. Captures front, left, and right face images with optional custom capture steps.
version: 1.0.0
homepage: https://github.com/SmartCodeJunctionInfinity/Smart-Face-Capture

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+5
  google_mlkit_face_detection: ^0.9.0
  path_provider: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
